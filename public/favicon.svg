<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Developer Resource Explorer favicon</title>
  <desc id="desc">Dark rounded square icon with a blue code symbol above an open book.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="96" fill="url(#bg)"/>

  <!-- Code symbol -->
  <g fill="none" stroke="url(#blue)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 132l-58 50 58 50"/>
    <path d="M332 132l58 50-58 50"/>
    <path d="M279 108l-46 148"/>
  </g>

  <!-- Book outer shape -->
  <path d="M70 291c54-15 112-5 154 24 15 10 26 21 32 31 6-10 17-21 32-31 42-29 100-39 154-24l24 116c-65-17-126-8-174 23-18 11-30 24-36 36-6-12-18-25-36-36-48-31-109-40-174-23z"
        fill="url(#blue)"/>

  <!-- Book pages -->
  <path d="M90 270c51-10 99-1 135 24 16 11 26 23 31 33v104c-7-11-18-22-32-31-41-26-88-34-142-22z"
        fill="#f8fafc"/>
  <path d="M422 270c-51-10-99-1-135 24-16 11-26 23-31 33v104c7-11 18-22 32-31 41-26 88-34 142-22z"
        fill="#f8fafc"/>

  <!-- Inner page lines -->
  <path d="M105 333c43-5 83 3 114 22 15 9 27 19 37 32"
        fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
  <path d="M407 333c-43-5-83 3-114 22-15 9-27 19-37 32"
        fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
</svg>
